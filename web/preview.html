<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全景环视</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/web/preview.css">
</head>
<body>

<canvas id="view"></canvas>

<!-- 加载状态 -->
<div id="boot" class="boot">
  <div class="boot__inner">
    <div class="boot__label">正在展开全景</div>
    <div class="boot__bar"><span id="bootFill"></span></div>
  </div>
</div>

<!-- 顶部：场景名与朝向刻度 -->
<header class="hud hud--top">
  <div class="scene">
    <span class="scene__name" id="sceneName">—</span>
    <span class="scene__meta" id="sceneMeta"></span>
  </div>
  <div class="compass" aria-hidden="true">
    <span class="compass__needle" id="compassNeedle">N</span>
    <span class="compass__deg" id="compassDeg">0°</span>
  </div>
</header>

<!-- 底部：提示 + VR -->
<footer class="hud hud--bottom">
  <p class="hint">
    <span>拖动环视</span>
    <span>滚轮 / 双指缩放</span>
    <span>双击归位</span>
  </p>
  <button id="vrBtn" class="vr" type="button" hidden>进入 VR</button>
</footer>

<!-- 场景切换条：只有多个场景时才显示 -->
<nav id="scenes" class="scenes" hidden aria-label="场景切换"></nav>

<!-- 切换场景时的进度条。
     注意这里不能用整屏遮罩：早先用一个 inset:0 的近黑遮罩做"过渡"，
     结果切场景的整段时间（要下载并解码 6 张 2048² 的图，可能好几百毫秒
     到几秒）屏幕全黑、连 HUD 一起盖住，看起来像崩了。
     现在改成顶部一条细进度线，旧画面保持可见，切好的一瞬间原子换图。 -->
<div id="loadbar" class="loadbar" hidden><span id="loadbarFill"></span></div>

<div id="err" class="err" hidden role="alert"></div>

<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>
<script>
// 从 URL 取出项目 id：/p/<8位十六进制>
const PANO_PROJECT = (location.pathname.match(/^\/p\/([0-9a-f]{8})$/) || [])[1];
</script>
<script type="module" src="/web/preview.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
